
services:
  web:
    build: .
    working_dir: /app/web
    environment:
      PYTHONPATH: /app:/app/web
      DJANGO_SETTINGS_MODULE: stocks_web.settings
    volumes:
      - .:/app
    command: gunicorn stocks_web.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload
    ports:
      - "8000:8000"
  automation:
    build: .
    working_dir: /app
    env_file:
      - stocks_helper/snaptrade/.env
      - .env
    environment:
      PYTHONPATH: /app:/app/web
      DJANGO_SETTINGS_MODULE: stocks_web.settings
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    profiles:
      - jobs
#    command: python -m stocks_helper.snaptrade.main --db